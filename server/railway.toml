# Deploy to Railway. Root directory is this folder (server/).
# Railway injects PORT; Spring Boot already reads it via ${PORT:8080}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
