server:
  port: ${PORT:8080}

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/kismet}
  application:
    name: kismet-server

management:
  endpoints:
    web:
      exposure:
        include: health,info

kismet:
  security:
    # Startup fails on development auth settings unless this is explicitly set.
    allow-insecure-config: ${ALLOW_INSECURE_CONFIG:false}
  dev:
    # Enables POST /dev/seed-test-friend for single-device demos. Keep false in production.
    seed-enabled: ${DEV_SEED_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars!!}
    access-ttl-seconds: ${JWT_ACCESS_TTL:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:2592000}
  apple:
    # Comma-separated list of allowed Apple JWT audiences (iOS bundle IDs).
    client-id: "${APPLE_CLIENT_ID:bhanageviraj.indeKismet,sanjivanand.IndeKismet}"
    verify-token: ${APPLE_VERIFY_TOKEN:false}
  cors:
    origins: ${CORS_ORIGINS:*}
  friends:
    invite-code-ttl-minutes: ${INVITE_CODE_TTL_MINUTES:60}
    max-friends: ${MAX_FRIENDS:500}
  blobs:
    ttl-hours: ${BLOB_TTL_HOURS:12}
    max-ciphertext-bytes: ${BLOB_MAX_CIPHERTEXT_BYTES:4096}
    max-batch-size: ${BLOB_MAX_BATCH_SIZE:500}
  apns:
    # Silent push wake for LOCATION blobs. Leave enabled=false for local demos without a .p8 key.
    enabled: ${APNS_ENABLED:false}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    # Prefer key-path on disk; key-p8 can hold the PEM inline for hosted demos.
    key-path: ${APNS_KEY_PATH:}
    key-p8: ${APNS_KEY_P8:}
    bundle-id: ${APNS_BUNDLE_ID:sanjivanand.IndeKismet}
    production: ${APNS_PRODUCTION:false}
